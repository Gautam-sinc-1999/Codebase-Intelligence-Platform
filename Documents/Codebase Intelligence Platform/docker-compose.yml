# Backing services for local development.
#
# Without these the platform runs on fallbacks: JSON files for documents, an in-memory cache, and
# an in-process NetworkX graph. Those are durable and honest — GET / reports which backend each
# store resolved to — but they are single-process, and the graph fallback has different
# performance characteristics from Cypher.
#
#   docker compose up -d
#   curl localhost:8000/ | jq .backends     # should show mongodb / redis / neo4j
#
# Credentials here are development defaults and are safe to commit. Override them in backend/.env
# for anything reachable beyond localhost. Note that every port binds to 127.0.0.1 explicitly, so
# none of these services is exposed on the network.

services:
  mongodb:
    image: mongo:7
    container_name: ci-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: ci-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    # Conversation working state is a cache, not a system of record, so it is capped and
    # allowed to evict rather than growing without bound.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: ci-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"   # browser UI
      - "127.0.0.1:7687:7687"   # bolt
    environment:
      NEO4J_AUTH: "neo4j/password"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512M"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

volumes:
  mongo-data:
  neo4j-data:
