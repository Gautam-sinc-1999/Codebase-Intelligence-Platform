# Backing services for local development.
#
# Without these the platform runs on fallbacks: JSON files for documents, an in-memory cache, and
# an in-process NetworkX graph. Those are durable and honest — GET / reports which backend each
# store resolved to — but they are single-process, and the graph fallback has different
# performance characteristics from Cypher.
#
#   docker compose up -d
#   curl localhost:8000/ | jq .backends     # should show mongodb / redis / neo4j
#
# Credentials here are development defaults and are safe to commit. Override them in backend/.env
# for anything reachable beyond localhost. Note that every port binds to 127.0.0.1 explicitly, so
# none of these services is exposed on the network.

services:
  mongodb:
    image: mongo:7
    container_name: ci-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: ci-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    # Conversation working state is a cache, not a system of record, so it is capped and
    # allowed to evict rather than growing without bound.
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: ci-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"   # browser UI
      - "127.0.0.1:7687:7687"   # bolt
    environment:
      NEO4J_AUTH: "neo4j/password"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512M"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  # ── Observability (optional) ────────────────────────────────────────────────
  # Start with:  docker compose --profile observability up -d
  #
  # Left out of the default `up` deliberately. Langfuse needs Postgres, ClickHouse and MinIO
  # alongside it — four containers to watch traces of a system that runs perfectly well without
  # any of them. The application treats tracing exactly like every other store here: absent keys
  # mean the feature is off, and nothing else changes.
  langfuse-db:
    image: postgres:16-alpine
    container_name: ci-langfuse-db
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 10

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: ci-langfuse-clickhouse
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_DB: default
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  langfuse-minio:
    # Quay, not Docker Hub: `minio/minio:latest` no longer resolves there and the pull fails
    # with "repository does not exist", which reads like an auth problem and is not one.
    image: quay.io/minio/minio:latest
    container_name: ci-langfuse-minio
    profiles: ["observability"]
    restart: unless-stopped
    # The bucket has to exist before Langfuse uploads to it, and MinIO has no "create on write".
    # A directory under /data *is* a bucket, so making it at boot is the whole setup step.
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server /data --address ":9000" --console-address ":9001"'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    volumes:
      - langfuse-minio-data:/data
    # No healthcheck: the server image ships no `mc` or `curl` to probe with, and nothing here
    # gates on it being healthy — the dependents below wait for `service_started`.

  langfuse:
    image: langfuse/langfuse:3
    container_name: ci-langfuse
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      langfuse-db: {condition: service_healthy}
      langfuse-clickhouse: {condition: service_healthy}
      langfuse-minio: {condition: service_started}
    ports:
      # 3001, because the frontend dev server already owns 3000.
      - "127.0.0.1:3001:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      # Single-node ClickHouse. Langfuse's migrations otherwise create ReplicatedMergeTree
      # tables `ON CLUSTER default`, which need a ZooKeeper/Keeper quorum — so both containers
      # crash-loop on "There is no Zookeeper configuration in server config". The error text
      # blames an unreachable database or a password needing URL-encoding; it is neither.
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      REDIS_CONNECTION_STRING: redis://redis:6379
      # Development defaults. Generate real values before exposing this anywhere.
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: "15158443822ce22de3d8595c19c564da1a698641bbc59f94c537ca88aa821217"
      SALT: "63a4a2e0541082345a5635afe3627e91"
      # QUOTED, and this matters: 64 unquoted zeros are valid YAML for the integer 0, so
      # Compose passed ENCRYPTION_KEY="0" and Langfuse rejected it as "must be 64 hex
      # characters" while the file plainly showed 64 of them. Generated via openssl rand -hex 32.
      ENCRYPTION_KEY: "3d0ccda553501c8f6d1ac73e5c37fb2733a711cf1dc238c54b77821e942b2827"
      TELEMETRY_ENABLED: "false"

  # Langfuse v3 is two processes, not one. The web container accepts ingestion and queues it;
  # this drains the queue into ClickHouse. Without it the UI comes up perfectly and traces
  # simply never appear — events pile up in Redis with nothing reading them, and there is no
  # error anywhere to explain it.
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: ci-langfuse-worker
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      langfuse-db: {condition: service_healthy}
      langfuse-clickhouse: {condition: service_healthy}
      langfuse-minio: {condition: service_started}
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      # Single-node ClickHouse. Langfuse's migrations otherwise create ReplicatedMergeTree
      # tables `ON CLUSTER default`, which need a ZooKeeper/Keeper quorum — so both containers
      # crash-loop on "There is no Zookeeper configuration in server config". The error text
      # blames an unreachable database or a password needing URL-encoding; it is neither.
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      REDIS_CONNECTION_STRING: redis://redis:6379
      # Must match the web container exactly: these key the encrypted fields and hashed API
      # keys in Postgres, so a mismatch makes the worker unable to read what the web wrote.
      SALT: "63a4a2e0541082345a5635afe3627e91"
      # QUOTED, and this matters: 64 unquoted zeros are valid YAML for the integer 0, so
      # Compose passed ENCRYPTION_KEY="0" and Langfuse rejected it as "must be 64 hex
      # characters" while the file plainly showed 64 of them. Generated via openssl rand -hex 32.
      ENCRYPTION_KEY: "3d0ccda553501c8f6d1ac73e5c37fb2733a711cf1dc238c54b77821e942b2827"
      TELEMETRY_ENABLED: "false"

volumes:
  mongo-data:
  neo4j-data:
  langfuse-db-data:
  langfuse-clickhouse-data:
  langfuse-minio-data:
